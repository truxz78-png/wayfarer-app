name: Build Signed AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'androidApp/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add launcher icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p androidApp/app/src/main/res/$d
            cp icon-192-1.png androidApp/app/src/main/res/$d/ic_launcher.png
            cp icon-192-1.png androidApp/app/src/main/res/$d/ic_launcher_round.png
          done

      - name: Decode signing keystore
        working-directory: androidApp
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Verify keystore
        working-directory: androidApp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build release AAB
        working-directory: androidApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/androidApp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-release-aab
          path: androidApp/app/build/outputs/bundle/release/*.aab
